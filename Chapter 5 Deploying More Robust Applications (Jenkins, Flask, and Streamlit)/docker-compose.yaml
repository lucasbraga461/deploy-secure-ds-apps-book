version: "3.7" 
 
services: 
 streamlit_calc: 
   build: 
     context: streamlit_calc 
   ports: 
     - "8501" 
   restart: always 
 
 # flask: 
 #   build: 
 #     context: flask 
 #   ports: 
 #     - "8502" 
 #   volumes: 
 #     - ./flask/logs:/app/logs 
 #   restart: always 
 
 jenkins: 
   build: 
     context: jenkins 
   ports: 
     - "8080" 
   user: "${JENKINS_UID}:${JENKINS_GID}" 
   environment: 
     - JENKINS_UID=${JENKINS_UID} 
     - JENKINS_GID=${JENKINS_GID} 
     - AWS_CONFIG_FILE=/app/.aws/config 
   volumes: 
     - ./streamlit_calc/data:/app/data 
     - ./jenkins/.aws:/app/.aws 
     - ./jenkins/var/jenkins_home:/var/jenkins_home 
   restart: always 
 
 nginx: 
   image: nginx:latest 
   volumes: 
     - ./config/nginx.conf:/etc/nginx/nginx.conf:ro 
     - ./config/lb-webserver_pro_combined.crt:/etc/pki/nginx/lb-webserver_pro_combined.crt:ro 
     - ./config/private/private.key:/etc/pki/nginx/private/private.key:ro 
     - ./config/proxy_params:/etc/nginx/proxy_params:ro 
   depends_on: 
     - streamlit_calc 
     - jenkins 
     # - flask 
   ports: 
     - "8501:8501" 
     - "8504:8504" 
     # - "8502:8502" 
   restart: always 
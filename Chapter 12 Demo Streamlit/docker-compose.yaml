version: "3.7"

services:
 # streamlit_calc:
 #   build:
 #     context: streamlit_calc
 #   ports:
 #     - "8501"
 #   restart: always

 streamlit_dashboard:
   build:
     context: streamlit_dashboard
   ports:
     - "8501"
   environment:
     - AWS_CONFIG_FILE=/app/.aws/config
   restart: always

 flask:
   build:
     context: flask
   ports:
     - "8502"
   volumes:
     - ./flask/logs:/app/logs
   restart: always

 jenkins:
   build:
     context: jenkins
   ports:
     - "8080"
   volumes:
     # - ./streamlit_calc/data:/app/data
     - ./jenkins/.aws:/app/.aws
     - ./jenkins/config:/app/config
     - ./jenkins/etl_scripts:/app/etl_scripts
     - ./jenkins/var/jenkins_home:/var/jenkins_home # Remember to sudo chown -R 1001:1001 jenkins/var/jenkins_home/ and sudo chmod 775 jenkins/var/jenkins_home/ (so that the volume can be used by docker user)
   user: "${JENKINS_UID}:${JENKINS_GID}"   
   environment:
     - JENKINS_UID=${JENKINS_UID}
     - JENKINS_GID=${JENKINS_GID}
     - AWS_CONFIG_FILE=/app/.aws/config
   restart: always

 nginx:
   image: nginx:latest
   volumes:
     - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
     - ./config/lb-webserver_pro_combined.crt:/etc/pki/nginx/lb-webserver_pro_combined.crt:ro
     - ./config/private/private.key:/etc/pki/nginx/private/private.key:ro
     - ./config/proxy_params:/etc/nginx/proxy_params:ro
   depends_on:
     - flask
     # - streamlit_calc
     - streamlit_dashboard
     - jenkins
   ports:
     - "80:80"
     - "443:443"
   restart: always
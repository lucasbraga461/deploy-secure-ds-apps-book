# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;
# root /usr/share/nginx/html;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
# include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    # proxy_headers_hash_max_size 1024;
    # proxy_headers_hash_bucket_size 128;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    # include /etc/nginx/conf.d/*.conf;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name streamlit.lb-webserver.pro flask.lb-webserver.pro jenkins.lb-webserver.pro;
        # return 301 https://$server_name$request_uri;
        return 301 https://$host$request_uri;
    }

 # Settings for a TLS enabled server.
    # Streamlit subdomain
    server {
        listen 443 ssl;
        server_name streamlit.lb-webserver.pro;

        ssl_certificate "/etc/pki/nginx/lb-webserver_pro_combined.crt";
        ssl_certificate_key "/etc/pki/nginx/private/private.key";
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout  10m;
        # ssl_ciphers PROFILE=SYSTEM;
        ssl_prefer_server_ciphers on;

        # Load configuration files for the default server block.
        include /etc/nginx/default.d/*.conf;

        error_page 404 /404.html;
            location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
            location = /50x.html {
        }
        
        location / {
            include proxy_params;
            proxy_pass http://streamlit_dashboard:8501;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # location /_stcore/stream {
        #     include proxy_params;
        #     proxy_pass http://streamlit:8501/_stcore/stream;
        # }
    }
    # Flask subdomain
    server {
        listen 443 ssl;
        server_name flask.lb-webserver.pro;

        ssl_certificate "/etc/pki/nginx/lb-webserver_pro_combined.crt";
        ssl_certificate_key "/etc/pki/nginx/private/private.key";
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout  10m;
        # ssl_ciphers PROFILE=SYSTEM;
        ssl_prefer_server_ciphers on;

        # Load configuration files for the default server block.
        include /etc/nginx/default.d/*.conf;

        error_page 404 /404.html;
            location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
            location = /50x.html {
        }
        
        location / {
            include proxy_params;
            proxy_pass http://flask:8502;
        }
    }
    # Jenkins subdomain
    server {
        listen 443 ssl;
        server_name jenkins.lb-webserver.pro;

        ssl_certificate "/etc/pki/nginx/lb-webserver_pro_combined.crt";
        ssl_certificate_key "/etc/pki/nginx/private/private.key";
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout  10m;

        include /etc/nginx/default.d/*.conf;

        error_page 404 /404.html;
        location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        }
        
        location / {
            include proxy_params;
            proxy_pass http://jenkins:8080;  # Make sure this matches the internal port Jenkins is running on
             # Required headers for Jenkins
            # proxy_set_header Host $host;
            # proxy_set_header X-Real-IP $remote_addr;
            # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # proxy_set_header X-Forwarded-Proto $scheme;
            # proxy_set_header X-Forwarded-Port 443;
            # proxy_buffering off;  # Jenkins doesn't support proxy buffering
            # proxy_request_buffering off;  # Allow large payloads
        }
    }
}
